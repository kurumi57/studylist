<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習管理アプリケーション</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/home.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="d-flex align-items-center flex-wrap my-4">
        <h1>学習管理アプリケーション</h1>

        <div class="login-area d-flex align-items-center gap-3 ms-auto">
            <p class="login-user">
                ログイン中：<span th:text="${username}"></span>
            </p>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn btn-outline-secondary">ログアウト</button>
            </form>
        </div>
    </div>

    <div class="study_form card p-3 mb-4">
        <h2 class="mb-3">学習の記録</h2>

        <form th:action="@{/add}" method="post">
            <label class="form-label">学習日</label>
            <input name="date" type="date" class="form-control"/>
            <label class="form-label">学習内容</label>
            <input name="content" type="text" class="form-control"/>
            <label class="form-label">学習時間(分)</label>
            <input id="studyMinutes" type="number" min="0" step="1" class="form-control time-input"/>
            <input id="studyTime" name="time" type="hidden"/>

            <div class="timer-buttons">
                <button type="button" id="startButton" class="btn btn-success">スタート</button>
                <button type="button" id="finishButton" class="btn btn-danger">ストップ</button>
                <button type="button" id="clearButton" class="btn btn-secondary">クリア</button>
                <p id="timerStatus"></p>
                <p id="studyTimeDisplay"></p>
            </div>
            <button type="submit" class="btn btn-primary register-button">登録</button>
        </form>
    </div>

    <div class="studylist card p-3">
        <h2 class="mb-3">学習一覧</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="text-center table-dark">
                <tr>
                    <th class="hidden">ID</th>
                    <th>学習日</th>
                    <th>学習内容</th>
                    <th>学習時間</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="study : ${studyList}">
                    <td class="hidden" th:text="${study.id}"></td>
                    <td class="study-date text-nowrap" th:text="${study.date}"></td>
                    <td th:text="${study.content}"></td>
                    <td class="study-time text-nowrap" th:text="${study.formattedTime()}"
                        th:attr="data-time=${study.time}"></td>
                    <td class="action-cell">
                        <div class="d-flex gap-5 justify-content-center">
                        <button type="button" class="btn btn-warning" onclick="
        let row = this.parentElement.parentElement;
        getElementById('update_id').value=row.cells[0].firstChild.data;
        getElementById('update_date').value=row.cells[1].firstChild.data;
        getElementById('update_content').value=row.cells[2].firstChild.data;

        let hours = row.cells[3].dataset.time;
        getElementById('update_minutes').value = hours * 60;
        getElementById('update_time').value = hours;

        var dialog = getElementById('updateDialog');
        dialog.style.display = 'block';
        ">更新
                        </button>
                        <form th:action="@{/delete}" method="post">
                            <button type="submit" class="btn btn-danger">削除</button>
                            <input type="hidden" name="id" th:value="${study.id}"/>
                        </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="updateDialog" class="card p-4">
        <div class="study_form">
            <h2 class="mb-4">学習の更新</h2>
            <form th:action="@{/update}" method="post">
                <input id="update_id" name="id" type="hidden"/>
                <label class="form-label">学習日</label>
                <input id="update_date" name="date" type="date" class="form-control"/>
                <label class="form-label">学習内容</label>
                <input id="update_content" name="content" type="text" class="form-control"/>
                <label class="form-label">学習時間(分)</label>
                <input id="update_minutes" type="number" min="0" step="1" class="form-control"/>
                <input id="update_time" name="time" type="hidden"/>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">更新</button>
                    <button type="reset" class="btn btn-secondary"
                            onclick="getElementById('updateDialog').style.display='none';">キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let startTime;
        let finishTime;

        document.getElementById("studyMinutes").addEventListener("input", function () {
            let minutes = this.value;

            document.getElementById("studyTime").value = minutes / 60;
        })

        document.getElementById("update_minutes").addEventListener("input", function () {
            let minutes = this.value;

            document.getElementById("update_time").value = minutes / 60;
        })

        document.getElementById("startButton").addEventListener("click", function () {
            startTime = new Date();
            finishTime = null;

            document.getElementById("studyMinutes").value = "";
            document.getElementById("studyTime").value = "";
            document.getElementById("studyTimeDisplay").textContent = "";

            document.getElementById("timerStatus").textContent = "計測中...";
        });

        document.getElementById("finishButton").addEventListener("click", function () {

            if (!startTime) {
                document.getElementById("timerStatus").textContent = "先にスタートを押してください";
                return;
            }

            if (finishTime) {
                return;
            }

            finishTime = new Date();

            let elapsedTime = finishTime - startTime;
            let studyTime = (elapsedTime / 1000 / 60 / 60).toFixed(2);

            let minutes = Math.floor(elapsedTime / 1000 / 60);
            let seconds = Math.floor(elapsedTime / 1000 % 60);

            document.getElementById("studyMinutes").value = minutes;
            document.getElementById("studyTimeDisplay").textContent = minutes + "分" + seconds + "秒";
            document.getElementById("studyTime").value = studyTime;
            document.getElementById("timerStatus").textContent = "";
        });

        document.getElementById("clearButton").addEventListener("click", function () {
            startTime = null;
            finishTime = null;
            document.getElementById("studyTimeDisplay").textContent = "";
            document.getElementById("studyTime").value = "";
            document.getElementById("timerStatus").textContent = "";
            document.getElementById("studyMinutes").value = "";
        })

    </script>
</div>
</body>
</html>

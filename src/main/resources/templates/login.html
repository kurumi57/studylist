<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>ログイン</h1>

<p th:if="${param.error}">
    ユーザー名またはパスワードが正しくありません
</p>

<form th:action="@{/login}" method="post">

<label>ユーザー名</label>
<input type="text" name="username">

<label>パスワード</label>
<input type="password" name="password">

    <button type="submit">ログイン</button>

</form>
</body>
</html>

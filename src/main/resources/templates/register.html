<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>
<h1>ユーザー登録</h1>

<form th:action="@{/register}" method="post">
  <label>ユーザー名</label>
  <input type="text" name="username">

  <label>パスワード</label>
  <input type="password" name="password">

  <button type="submit">登録</button>
</form>
</body>
</html>
